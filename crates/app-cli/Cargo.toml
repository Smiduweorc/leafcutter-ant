[package]
name = "app-cli"
description = "The command-line host for the app library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "app"
path = "src/main.rs"
# A binary has no API to document, and its docs would land on top of the
# library's in target/doc/app.
doc = false

[dependencies]
app = { path = "../app" }

[lints]
workspace = true
