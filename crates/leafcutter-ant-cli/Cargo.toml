[package]
name = "leafcutter-ant-cli"
description = "The command-line host for the leafcutter-ant compiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "leafcutter"
path = "src/main.rs"
# A binary has no API to document, and its docs would land on top of the
# library's in target/doc/leafcutter_ant.
doc = false

[dependencies]
leafcutter-ant = { path = "../leafcutter-ant" }
# Drives the library's futures to completion; the build runs on one thread.
futures-executor = "0.3"
# Fetches the pack and file definitions from bridge-core/editor-packages, as
# the Deno CLI does, over HTTPS with rustls and ring (no C toolchain needed).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true
