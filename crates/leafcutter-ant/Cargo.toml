[package]
name = "leafcutter-ant"
description = "A native port of the Dash compiler for Minecraft Bedrock add-ons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# join_all, to run file reads, copies and writes concurrently where TS Dash
# uses Promise.all; the library picks no executor.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# ECMAScript regular expressions, to run the regex sources picomatch builds
# with the semantics V8 gives them; utf16 matches over UTF-16 code units, as
# RegExp#exec does outside unicode mode.
regress = { version = "0.12.0", features = ["utf16"] }
# Keeps object keys in insertion order with O(1) lookup; JavaScript property
# order is built on top of it in src/json/mod.rs. The floor is 2.5 because swc
# 0.278.1 needs indexmap 2.5.0 locked (see swc below).
indexmap = "2.5"
# Number#toString exactly as ECMAScript specifies it, from the Boa engine.
ryu-js = "1.0.3"
# The TypeScript compiler of the typeScript plugin. 0.278.1 is the swc crate
# @swc/wasm-web 1.6.5 is built from, so the output matches TS Dash byte for
# byte. Cargo.lock pins every swc_* crate to the version in swc's own v1.6.5
# lockfile, and the crates swc_common 0.34 needs at old versions: serde and
# serde_derive 1.0.219 (1.0.220 removed the serde::__private module it uses),
# serde_json 1.0.115, indexmap 2.5.0 and semver 1.0.21. Do not let
# `cargo update` move them.
swc = "=0.278.1"
swc_common = "0.34"
# The syntax tree js-runtime's import/export rewrite walks, and the parser
# options that pick JavaScript or TypeScript; the versions swc 0.278.1
# locks. anyhow is the error type swc's handler API is written in.
swc_ecma_ast = "0.115"
swc_ecma_parser = "0.146"
anyhow = "1"
# swc's options are built from the same JSON the plugin hands @swc/wasm-web;
# swc depends on serde_json already.
serde_json = "1.0.115"
# QuickJS, the engine user scripts and extension plugins run in: generator
# scripts, custom commands and compiler plugins from extensions are
# JavaScript modules. It builds to WebAssembly and embeds without a V8
# download. Its JSON.stringify and Number#toString match V8's on every golden
# vector (tests/vectors.rs), so scripts that stringify their own output write
# the bytes TS Dash writes. Default features only: the module loader, the
# futures integration and classes are built here, on top of plain functions.
rquickjs = "0.14.0"

[dev-dependencies]
# Runs the file system's futures to completion in tests; the library itself
# picks no executor.
futures-executor = "0.3"
# Reads the golden vectors. preserve_order keeps keys in source order and
# float_roundtrip parses numbers correctly rounded, as JSON.parse does.
# 1.0.115 is the version swc needs locked.
serde_json = { version = "1.0.115", features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true
