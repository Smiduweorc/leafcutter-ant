# git-cliff configuration: https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md from Conventional Commits. Run the "changelog" task.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# Tera template: https://keats.github.io/tera/docs/
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
# The keys below that match git-cliff's current defaults are set explicitly on
# purpose: a future git-cliff release changing a default cannot then silently
# reshape the changelog.
conventional_commits = true
filter_unconventional = true
split_commits = false
# Order matters: the first parser that matches wins. The skips come first so a
# release or dependency commit is dropped whatever else it says, then the
# security rule, then the per-type groups. git-cliff matches `message` against
# the whole commit message, body included, so the security rule catches
# "security" in any case in the subject or the body. A commit no parser matches
# is still kept (filter_commits = false), under a heading named after its raw
# type, so every type scripts/commit-msg.sh accepts is mapped to a group here.
commit_parsers = [
  { message = "^chore\\(release\\): prepare for", skip = true },
  # Covers both chore(deps) and dependabot's chore(deps-dev).
  { message = "^chore\\(deps", skip = true },
  { message = "(?i)security", group = "Security" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^revert", group = "Revert" },
  { message = "^(chore|ci|build)", group = "Miscellaneous Tasks" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
